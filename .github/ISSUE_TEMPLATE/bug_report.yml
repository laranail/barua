name: Bug report
description: Something does not behave the way the documentation says it should.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        **Security problems do not belong here.** Report them privately: see the security policy.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The template or component markup, the builder calls, and the relevant `laranail.barua` configuration.
      render: php
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Builder errors
      description: The output of `$errorBuilder->getErrors()`, and anything barua logged.
      render: shell

  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true

  - type: input
    id: php
    attributes:
      label: PHP and Laravel versions
      placeholder: 'PHP 8.4.17, Laravel 13.2'
    validations:
      required: true
